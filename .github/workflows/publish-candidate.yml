name: Publish approved candidate preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: nikopol000/financial-autonomy-app
          ref: feat/v018-calculation-explanations-review
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run typecheck
      - name: Verification
        working-directory: app
        run: node --experimental-strip-types --test --test-isolation=none tests/budgets.test.ts tests/dailyBudget.test.ts tests/balanceChecks.test.ts tests/coverage.test.ts tests/dashboardLayout.test.ts tests/webVault.test.ts
      - name: Configure active preview base URL
        working-directory: app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo = app.expo || {};
          app.expo.experiments = { ...(app.expo.experiments || {}), baseUrl: '/financial-autonomy-preview' };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - working-directory: app
        run: npx expo export --platform web
      - name: Replace active preview
        run: |
          find preview -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a app/dist/. preview/
          touch preview/.nojekyll
      - name: Publish
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish v17.32 calculation explanations preview"
          git push origin HEAD:main
