name: Chromium WEB vault and backup acceptance
on:
  pull_request:
    paths:
      - 'index.html'
      - '_expo/static/js/web/**'
      - 'tests/browser-vault-recovery-smoke.cjs'
      - 'tests/browser-confirmed-backup-restore-faults.cjs'
      - 'tests/browser-first-save-ui-retry.cjs'
      - 'tests/browser-vault-ui-audit.cjs'
      - 'tests/browser-v2-locks-research.cjs'
      - 'tests/browser-v2-restore-research.cjs'
      - 'tests/browser-authenticated-consent-legacy-writer-research.cjs'
      - 'tests/browser-consent-pagehide-reload-research.cjs'
      - 'tests/browser-consent-blocked-browser-sigkill-research.cjs'
      - 'tests/browser-archived-v1-compatibility-research.cjs'
      - 'tests/browser-archived-v2-interleavings-research.cjs'
      - 'tests/browser-v2-sealed-authority-research.cjs'
      - 'tests/browser-v2-idb-witness-research.cjs'
      - 'tests/browser-v2-idb-atomic-primary-research.cjs'
      - 'tests/browser-v2-reset-renderer-crash-research.cjs'
      - 'tests/browser-v2-reset-whole-browser-crash-research.cjs'
      - 'tests/browser-v2-reset-inflight-browser-crash-research.cjs'
      - 'tests/browser-v2-restore-operation-witness-research.cjs'
      - 'tests/browser-v2-conflict-readonly-ui-research.cjs'
      - 'tests/browser-populated-budget-audit.cjs'
      - '.github/workflows/browser-vault-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '_expo/static/js/web/**'
      - 'tests/browser-vault-recovery-smoke.cjs'
      - 'tests/browser-confirmed-backup-restore-faults.cjs'
      - 'tests/browser-first-save-ui-retry.cjs'
      - 'tests/browser-vault-ui-audit.cjs'
      - 'tests/browser-v2-locks-research.cjs'
      - 'tests/browser-v2-restore-research.cjs'
      - 'tests/browser-authenticated-consent-legacy-writer-research.cjs'
      - 'tests/browser-consent-pagehide-reload-research.cjs'
      - 'tests/browser-consent-blocked-browser-sigkill-research.cjs'
      - 'tests/browser-archived-v1-compatibility-research.cjs'
      - 'tests/browser-archived-v2-interleavings-research.cjs'
      - 'tests/browser-v2-sealed-authority-research.cjs'
      - 'tests/browser-v2-idb-witness-research.cjs'
      - 'tests/browser-v2-idb-atomic-primary-research.cjs'
      - 'tests/browser-v2-reset-renderer-crash-research.cjs'
      - 'tests/browser-v2-reset-whole-browser-crash-research.cjs'
      - 'tests/browser-v2-reset-inflight-browser-crash-research.cjs'
      - 'tests/browser-v2-restore-operation-witness-research.cjs'
      - 'tests/browser-v2-conflict-readonly-ui-research.cjs'
      - 'tests/browser-populated-budget-audit.cjs'
      - '.github/workflows/browser-vault-smoke.yml'
permissions:
  contents: read
jobs:
  browser-vault-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real Chromium local-only encrypted backup and blocked-vault smoke
        run: node tests/browser-vault-recovery-smoke.cjs
      - name: Characterize actual WEB confirmed-backup restore storage faults (synthetic only)
        run: node tests/browser-confirmed-backup-restore-faults.cjs
      - name: Verify actual WEB first-save UI retry and reload quarantine (synthetic only)
        run: node tests/browser-first-save-ui-retry.cjs
      - name: Research real Chromium Web Locks and cached-reset hazards (synthetic only)
        run: node tests/browser-v2-locks-research.cjs
      - name: Research authenticated WEB backup and cached v1 writer after locked reinspection (KNOWN UNSAFE)
        run: node tests/browser-authenticated-consent-legacy-writer-research.cjs
      - name: Research actual Chromium pagehide/reload with blocked IDB and queued Web Lock (NOT PRODUCTION)
        run: node tests/browser-consent-pagehide-reload-research.cjs
      - name: Research whole-browser SIGKILL while blocked IDB or Web Lock queued (NOT PRODUCTION)
        run: node tests/browser-consent-blocked-browser-sigkill-research.cjs
      - name: Research real Chromium two-tab v2 staged restore and reset (synthetic only)
        run: node tests/browser-v2-restore-research.cjs
      - name: Characterize real archived v1 modules in two Chromium tabs (KNOWN UNSAFE)
        run: node tests/browser-archived-v1-compatibility-research.cjs
      - name: Characterize actual cached v1 writers against isolated v2 authority (synthetic only)
        run: node tests/browser-archived-v2-interleavings-research.cjs
      - name: Characterize sealed v2 authority, reset replay and legacy drift in two Chromium tabs (NOT PRODUCTION)
        run: node tests/browser-v2-sealed-authority-research.cjs
      - name: Research IndexedDB witness replay detection and crash recovery in Chromium (NOT PRODUCTION)
        run: node tests/browser-v2-idb-witness-research.cjs
      - name: Research transactional IndexedDB primary authority in Chromium (NOT PRODUCTION)
        run: node tests/browser-v2-idb-atomic-primary-research.cjs
      - name: Characterize real Chromium renderer crash at reset boundaries (NOT PRODUCTION)
        run: node tests/browser-v2-reset-renderer-crash-research.cjs
      - name: Characterize whole Chromium browser SIGKILL with disposable persistent profile (NOT PRODUCTION)
        run: node tests/browser-v2-reset-whole-browser-crash-research.cjs
      - name: Characterize in-flight IDB and legacy deletion crash boundaries (NOT PRODUCTION)
        run: node tests/browser-v2-reset-inflight-browser-crash-research.cjs
      - name: Research atomic restore operation witness and post-commit acknowledgment (NOT PRODUCTION)
        run: node tests/browser-v2-restore-operation-witness-research.cjs
      - name: Research isolated read-only conflict screen, storage faults and mobile zoom (NOT PRODUCTION)
        run: node tests/browser-v2-conflict-readonly-ui-research.cjs
      - name: Audit actual blocked WEB mobile UI in light/dark (synthetic-only)
        run: node tests/browser-vault-ui-audit.cjs
      - name: Audit populated demo budgets at 320/390px light/dark and CSS zoom stress
        run: node tests/browser-populated-budget-audit.cjs
      - name: Retain synthetic-only read-only conflict screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-v2-conflict-readonly-ui-research
          path: artifacts/browser-v2-conflict-readonly/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic-only populated budget screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-populated-budget-audit
          path: artifacts/browser-populated-budget/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic-only mobile UI screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-vault-ui-audit
          path: artifacts/browser-vault-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic-only failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-vault-smoke-failure
          path: browser-vault-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 3
