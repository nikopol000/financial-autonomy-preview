name: Validate Financial Autonomy release
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate immutable v18.22 release bundle
        run: node scripts/prepare-v1822.cjs --write
      - name: Verify version and bundle consistency
        run: python3 scripts/check_release.py
      - name: Validate JavaScript syntax
        run: |
          BUNDLE=$(python3 -c "import re,pathlib; print(re.search(r'<script src=\"/financial-autonomy-preview/([^\"?]+)',pathlib.Path('index.html').read_text()).group(1))")
          node --check "$BUNDLE"
      - name: Romanian budget copy immutable-release regression
        run: node tests/budget-copy-regression.cjs
      - name: Verify v18.43 budget UI copy is engine-identical to v18.42
        run: node tests/budget-copy-followup-regression.cjs
      - name: Verify immutable v18.48 Romanian budget row is copy-only
        run: node tests/budget-primary-label-v1848-regression.cjs
      - name: Accessibility shell and unchanged financial engine
        run: node tests/shell-regression.cjs
      - name: WEB 18.55 navigation accessible name and immutable diff
        run: node tests/web-v1855-nav-accessible-name-regression.cjs
      - name: WEB 18.56 mobile brand two-line layout and immutable diff
        run: node tests/web-v1856-mobile-header-regression.cjs
      - name: Verify v18.22 candidate reconciliation independently of active release
        run: |
          node tests/reconciliation-v1822-candidate.cjs
          node --check _expo/static/js/web/index-v01822-reconciliation-20261022.js
      - name: Retain exact v18.22 candidate for release promotion
        uses: actions/upload-artifact@v4
        with:
          name: financial-autonomy-v18.22-candidate
          path: _expo/static/js/web/index-v01822-reconciliation-20261022.js
          if-no-files-found: error
          retention-days: 14
      - name: Reconciliation regression
        run: node tests/reconciliation-regression.cjs
      - name: Encrypted vault orphan-key regression
        run: node tests/vault-orphan-regression.cjs
      - name: Atomic reconciliation batch contract
        run: node tests/reconciliation-batch-regression.cjs
      - name: Reconciliation editor UI and guarded persistence
        run: node tests/reconciliation-ui-regression.cjs
      - name: Editor save error handling for account close and opening correction
        run: node tests/editor-save-error-regression.cjs
      - name: Reconciliation history reload void and persistence regression
        run: node tests/reconciliation-history-persistence-regression.cjs
      - name: Isolated demo eligibility fail-closed contract
        run: node tests/demo-eligibility-regression.cjs
      - name: Vault presence and empty ciphertext regression against active release
        run: node tests/vault-presence-regression.cjs
      - name: Vault corrupt ciphertext preservation against active release
        run: node tests/vault-corrupt-save-regression.cjs
      - name: Verify v18.44 reset-journal release changes only vault and platform
        run: node tests/reset-journal-bundle-regression.cjs
      - name: Verify immutable v18.45 blocked-vault guidance changed no financial logic
        run: node tests/blocked-vault-guidance-bundle-regression.cjs
      - name: Verify immutable v18.46 safe blocked-vault copy changed no financial logic
        run: node tests/blocked-vault-safe-copy-bundle-regression.cjs
      - name: Verify immutable v18.47 automatic light/dark palette changes only visual code
        run: node tests/auto-theme-bundle-regression.cjs
      - name: Bundled AES-GCM synthetic vault persistence and OpenSSL interop
        run: node tests/vault-real-crypto-regression.cjs
      - name: WEB 18.54 expiry of sensitive first-save retry handle (immutable diff)
        run: node tests/first-save-expiry-v1854-regression.cjs
      - name: WEB 18.54 real AES-GCM bounded first-save retry regression
        run: node tests/vault-first-save-retry-production.cjs
      - name: Research-only v2 atomic first-write prototype (not production)
        run: node --test tests/vault-v2-first-write-prototype.cjs
      - name: Research-only read-only recovery conflict UX contract (not production)
        run: node --test tests/vault-recovery-conflict-contract.cjs
      - name: Research-only bounded post-reset first-save retry protocol (not production)
        run: node --test tests/vault-first-save-bounded-retry-prototype.cjs
      - name: Research-only reset epoch fencing against legacy WEB tabs (not production)
        run: node --test tests/vault-reset-fencing-prototype.cjs
      - name: Candidate WEB 18.50 durable reset epoch and cached legacy integration
        run: node --test tests/vault-reset-v2-integration.cjs
      - name: Verify immutable WEB 18.50 changes only vault reset protocol
        run: node tests/reset-v1850-bundle-regression.cjs
      - name: Isolated memory-only demo session and real financial model
        run: node tests/demo-session-regression.cjs
      - name: Active isolated demo WEB integration regression
        run: node tests/demo-web-integration-regression.cjs
      - name: Verify active WEB demo preload write guard
        run: node tests/demo-preload-save-regression.cjs
