name: Validate Financial Autonomy release
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and bundle consistency
        run: python3 scripts/check_release.py
      - name: Validate JavaScript syntax
        run: |
          BUNDLE=$(python3 -c "import re,pathlib; print(re.search(r'<script src=\"/financial-autonomy-preview/([^\"?]+)',pathlib.Path('index.html').read_text()).group(1))")
          node --check "$BUNDLE"
      - name: Accessibility shell and unchanged financial engine
        run: node tests/shell-regression.cjs
      - name: Verify v18.22 candidate reconciliation independently of active release
        run: |
          node tests/reconciliation-v1822-candidate.cjs
          node scripts/prepare-v1822.cjs --write
          node --check _expo/static/js/web/index-v01822-reconciliation-20261022.js
      - name: Retain exact v18.22 candidate for release promotion
        uses: actions/upload-artifact@v4
        with:
          name: financial-autonomy-v18.22-candidate
          path: _expo/static/js/web/index-v01822-reconciliation-20261022.js
          if-no-files-found: error
          retention-days: 14
      - name: Reconciliation regression for active release (known v18.21 failure)
        continue-on-error: true
        run: node tests/reconciliation-regression.cjs
      - name: Enforce candidate regression tests before release
        run: node tests/reconciliation-v1822-candidate.cjs
